name: Warm build caches

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  warm-cache:
    strategy:
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.22.0
        with:
          java-version: 27
          java-distribution: liberica
          checkout-persist-credentials: true
          cache-prefix: ${{ runner.arch }}
          settings-servers: |
            [{
                "id": "reposilite-releases",
                "username": "${{ secrets.REPOSILITE_USERNAME }}",
                "password": "${{ secrets.REPOSILITE_PASSWORD }}"
            },
            {
                "id": "reposilite-snapshots",
                "username": "${{ secrets.REPOSILITE_USERNAME }}",
                "password": "${{ secrets.REPOSILITE_PASSWORD }}"
            }]
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: service/src/main/vueapp/package-lock.json
      - name: Populate Maven cache
        run: mvn -B test-compile -T 1C