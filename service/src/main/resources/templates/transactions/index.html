<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <title>Firefly III Quick Add</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #667085;
      --border: #d8dee9;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --danger: #b42318;
      --shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      color: var(--text);
      background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.18), transparent 34rem),
          linear-gradient(135deg, #f8fafc 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .page {
      width: min(100%, 560px);
    }

    .header {
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 0.4rem;
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .subtitle {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    #form-container {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(216, 222, 233, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      padding: 1.5rem;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    .field {
      display: grid;
      gap: 0.45rem;
    }

    label {
      color: #344054;
      font-size: 0.9rem;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 2.9rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 1rem;
      padding: 0.75rem 0.85rem;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition:
          border-color 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease;
    }

    select {
      background-image:
          linear-gradient(45deg, transparent 50%, #667085 50%),
          linear-gradient(135deg, #667085 50%, transparent 50%);
      background-position:
          calc(100% - 1.15rem) 50%,
          calc(100% - 0.8rem) 50%;
      background-size:
          0.35rem 0.35rem,
          0.35rem 0.35rem;
      background-repeat: no-repeat;
      padding-right: 2.25rem;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    button {
      margin-top: 0.5rem;
      min-height: 3rem;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      letter-spacing: -0.01em;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
      touch-action: manipulation;
      transition:
          transform 160ms ease,
          box-shadow 160ms ease,
          filter 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(37, 99, 235, 0.32);
      filter: brightness(1.03);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
    }

    .hint {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .htmx-request button,
    button.htmx-request {
      opacity: 0.7;
      cursor: wait;
    }

    .htmx-request button::after,
    button.htmx-request::after {
      content: "…";
    }

    .result {
      border-radius: 14px;
      padding: 1rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .result.success {
      color: var(--success);
      background: #ecfdf3;
      border: 1px solid #abefc6;
    }

    .result.error {
      color: var(--danger);
      background: #fef3f2;
      border: 1px solid #fecdca;
    }

    @media (max-width: 640px) {
      body {
        display: block;
        min-height: 100svh;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
      }

      .page {
        width: 100%;
        max-width: none;
        margin: 0 auto;
      }

      .header {
        margin: 1.25rem 0 1rem;
        text-align: left;
      }

      .eyebrow {
        font-size: 0.72rem;
      }

      h1 {
        font-size: clamp(2rem, 12vw, 2.65rem);
      }

      .subtitle {
        font-size: 0.95rem;
        line-height: 1.45;
      }

      #form-container {
        padding: 1rem;
        border-radius: 16px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.1);
        backdrop-filter: none;
      }

      form {
        gap: 0.9rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 0.9rem;
      }

      input,
      select,
      button {
        min-height: 3.25rem;
      }

      button {
        width: 100%;
        margin-top: 0.75rem;
      }
    }

    @media (max-width: 380px) {
      body {
        padding-inline: 0.75rem;
      }

      #form-container {
        padding: 0.85rem;
      }

      input,
      select {
        padding-inline: 0.75rem;
      }
    }
  </style>
</head>
<body>
<script>
  document.body.addEventListener('htmx:configRequest', function (event) {
    const token = document.querySelector('meta[name="_csrf"]').content;
    const header = document.querySelector('meta[name="_csrf_header"]').content;
    event.detail.headers[header] = token;
  });
</script>

<main class="page">
  <header class="header">
    <p class="eyebrow">Firefly III</p>
    <h1>Quick Add</h1>
    <p class="subtitle">Create a transaction without leaving your admin panel.</p>
  </header>

  <div id="form-container">
    <form hx-post="/transactions" hx-target="#form-container" hx-swap="outerHTML">
      <div class="field">
        <label for="description">Description</label>
        <input id="description" type="text" name="description" placeholder="Coffee, groceries, rent..." required/>
      </div>

      <div class="grid">
        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" type="number" step="0.01" name="amount" placeholder="0.00" required/>
        </div>

        <div class="field">
          <label for="sourceName">Source account</label>
          <select
              id="sourceName"
              name="sourceName"
              hx-get="/accounts"
              hx-target="this"
              hx-trigger="load"
              hx-swap="innerHTML"
              required>
            <option value="">Loading accounts...</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="destinationName">Destination account</label>
        <input id="destinationName" type="text" name="destinationName" placeholder="Vendor, shop, person..." required/>
        <span class="hint">Use the Firefly destination account name.</span>
      </div>

      <button type="submit">Create transaction</button>
    </form>
  </div>
</main>
</body>
</html>
